<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis voices</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/voices.css" />
    <script type="module" src="/voices.js"></script>
  </head>
  <body class="voices-page">
    <header>
      <h1>Jarvis voices</h1>
      <p class="note">
        Dev only. Every voice reads the same five sentences; the number under each is the time from asking to the first
        sound. Pick one with “Use this voice”, put the two lines it shows in <code>.env</code>, and restart Jarvis.
      </p>
    </header>
    <main>
      <p id="current" class="note"></p>
      <p id="status" class="note" role="status"></p>
      <div id="choice" hidden>
        <p>Put these in <code>.env</code> and restart:</p>
        <pre id="choice-lines"></pre>
      </div>
      <div class="table-wrap">
        <table id="voices">
          <thead><tr id="voices-head"></tr></thead>
          <tbody id="voices-body"></tbody>
        </table>
      </div>
    </main>
  </body>
</html>
