name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Personal profile is not committed
        run: |
          if git ls-files --error-unmatch data/profile.md >/dev/null 2>&1; then
            echo "::error file=data/profile.md::data/profile.md is personal data and must not be committed. Remove it with 'git rm --cached data/profile.md'."
            exit 1
          fi

      - name: Never-remember list is not committed
        run: |
          if git ls-files --error-unmatch data/never-remember.txt >/dev/null 2>&1; then
            echo "::error file=data/never-remember.txt::data/never-remember.txt holds personal names and must not be committed. Remove it with 'git rm --cached data/never-remember.txt'."
            exit 1
          fi

      - name: Whisper hints are not committed
        run: |
          if git ls-files --error-unmatch data/whisper-hints.txt >/dev/null 2>&1; then
            echo "::error file=data/whisper-hints.txt::data/whisper-hints.txt holds personal names and must not be committed. Remove it with 'git rm --cached data/whisper-hints.txt'."
            exit 1
          fi

      - name: Google tokens are not committed
        run: |
          if git ls-files 'data/google-tokens.json' 'data/google-oauth-client.json' 'data/google-gmail-*.json' | grep -q .; then
            echo "::error::Google OAuth files (data/google-*.json) hold secrets and must not be committed. Remove them with 'git rm --cached'."
            exit 1
          fi

      - name: Introspection reports are not committed
        run: |
          if git ls-files 'data/introspection/*' | grep -q .; then
            echo "::error::data/introspection/ holds your memories and must not be committed. Remove it with 'git rm -r --cached data/introspection'."
            exit 1
          fi

      - name: Memory database is not committed
        run: |
          if git ls-files 'data/*.sqlite' 'data/*.sqlite-*' | grep -q .; then
            echo "::error::A memory database under data/ is committed. It holds personal data; remove it with 'git rm --cached'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  minimum-node:
    name: Tests on the minimum Node (22.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
