name: PR references an issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require a closing keyword (e.g. "Closes #12")
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -Eiq '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+'; then
            echo "Issue reference found."
          else
            echo "::error::PR description must reference the issue it closes, e.g. 'Closes #12'."
            exit 1
          fi
